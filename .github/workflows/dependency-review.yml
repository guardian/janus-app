# Avoids introducing vulnerable dependencies to the main branch.

name: Dependency review
on:
  pull_request:

jobs:
  dependency-review:
    runs-on: ubuntu-latest

    permissions:
      # To write dependency submission
      contents: write
      # To write comment on PR
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Required because Dependabot Alerts doesn't natively support Scala
      - uses: guardian/setup-scala@c9f10cca1674ecb2ae7ee739786ef9f0cdb9d07c # v2.0.0
      - uses: scalacenter/sbt-dependency-submission@d84eef4c09e633bcf5f113bcad7fd5e9af1baee9 # v3.2.3
      
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          comment-summary-in-pr: always
