# Avoids introducing vulnerable dependencies to the main branch.

name: Dependency review
on:
  pull_request:

jobs:
  dependency-review:
    runs-on: ubuntu-latest

    permissions:
      # To write dependency submission
      contents: write
      # To write comment on PR
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Required because Dependabot Alerts doesn't natively support Scala
      - uses: guardian/setup-scala@56ec952f11409b28f4f7ae8d442e4d6deb87fc68 # v2.0.1
      - uses: scalacenter/sbt-dependency-submission@d84eef4c09e633bcf5f113bcad7fd5e9af1baee9 # v3.2.3
      
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          comment-summary-in-pr: always
