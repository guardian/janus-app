janus {
  accounts = [
    { name = "Test AWS Account", key = "test-aws-account" }
  ]
  permissions = [
    {
      account = "test-aws-account"
      label = "e2e-deny-all"
      description = "E2E test only - no AWS access"
      shortTerm = true
      # Explicitly deny access even if the underlying role grants permissions.
      policy = """{"Version":"2012-10-17","Statement":[{"Effect":"Deny","Action":"*","Resource":"*"}]}"""
    }
  ]
  access {
    defaultPermissions = []
    acl {
      dev-user = [
        { account = "test-aws-account", label = "e2e-deny-all" }
      ]
    }
  }
  superuser.acl = {}
  support {
    supportAccess = []
    rota = []
  }
}
