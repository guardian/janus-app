include "application.conf"

host = "http://localhost:9102"
data.fileLocation = "test/resources/e2e-janus-data.conf"
e2e.dynamodb.endpoint = "http://127.0.0.1:18000"

# Offline fixture only; this is not a real AWS role.
federation.test-aws-account.aws.roleArn = "arn:aws:iam::000000000000:role/e2e-deny-all"

auth {
  domain = "example.invalid"
  google {
    disabled = ${?GOOGLE_AUTH_DISABLED}
    clientId = "browser-test"
    clientSecret = "browser-test-not-a-real-secret"
    serviceAccountCertPath = "unused-in-browser-tests"
    2faUser = "browser-test@example.invalid"
    2faGroupId = "browser-test"
  }
}

passkeys.mode = Disabled

passkeys.manager {
  contactLink = "mailto:browser-test@example.invalid"
  contactLinkText = "Browser test"
}

developerPolicies.fetch.enabled = false
