services:
  dynamodb:
    image: amazon/dynamodb-local
    ports:
      - "8000:8000"
    volumes:
      - /etc/gu/data:/home/dynamodblocal/data
    working_dir: /home/dynamodblocal
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath data"
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:8000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  dynamodb-seed:
    image: public.ecr.aws/aws-cli/aws-cli:latest
    depends_on:
      dynamodb:
        condition: service_started
    environment:
      AWS_ENDPOINT_URL: http://dynamodb:8000
    volumes:
      - ../scripts/dynamodb_create_tables.sh:/scripts/dynamodb_create_tables.sh
    entrypoint: ["/scripts/dynamodb_create_tables.sh"]